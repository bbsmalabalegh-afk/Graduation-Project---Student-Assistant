<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Student Success Predictor</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ربط ملف الـ CSS الخارجي الموحد -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100">
        <div class="login-card p-4 p-md-5">
            <!-- Header الصفحة -->
            <div class="text-center mb-4">
                <h2 class="fw-bold title-main">تسجيل الدخول</h2>
                <p class="text-sub small">نظام التنبؤ بالتعثر الأكاديمي للطلاب</p>
            </div>

            <!-- نموذج الدخول -->
            <form id="loginForm" action="dashboard.html" method="GET">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">البريد الإلكتروني</label>
                    <input type="email" class="form-control custom-input" id="email" placeholder="student@univ.edu" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">كلمة المرور</label>
                    <input type="password" class="form-control custom-input" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-main w-100 py-2">دخول للنظام</button>
            </form>

            <div class="text-center mt-4">
                <a href="index.html" class="text-decoration-none small text-sub">← العودة للصفحة الرئيسية</a>
            </div>
        </div>
    </div>

</body>
</html>
